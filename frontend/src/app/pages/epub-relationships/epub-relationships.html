<div class="shell">

  <header>
    <div class="header-left">
      <a class="back-link" routerLink="/">← Library</a>
      <h1>Relationships</h1>
    </div>
    <span class="count" *ngIf="!loading()">{{ relationships().length }} pairs</span>
  </header>

  <!-- Legend -->
  <div class="legend" *ngIf="!loading() && !error()">
    <span class="legend-item" *ngFor="let t of relationshipTypes()">
      <span class="legend-dot" [style.background]="typeColor(t)"></span>
      {{ formatType(t) }}
    </span>
  </div>

  <main>
    <p class="state-msg" *ngIf="loading()"><span class="pulse">Fetching relationships…</span></p>
    <p class="state-msg error" *ngIf="error()">{{ error() }}</p>

    <div class="graph-wrap" *ngIf="!loading() && !error()">
      <svg #svgEl class="graph-svg"></svg>

      <!-- Tooltip -->
      <div
        class="tooltip"
        [class.visible]="tooltip().visible"
        [style.left.px]="tooltip().x"
        [style.top.px]="tooltip().y"
      >
        <div class="tooltip-pair">
          <span class="tooltip-char">{{ tooltip().char1 }}</span>
          <span class="tooltip-sep">↔</span>
          <span class="tooltip-char">{{ tooltip().char2 }}</span>
        </div>
        <span class="tooltip-type" [style.color]="typeColor(tooltip().type)">{{ formatType(tooltip().type) }}</span>
      </div>
    </div>
  </main>

</div>
