<div class="shell">
  <header>
    <h1>Library</h1>
    <span class="count" *ngIf="!loading()">{{ epubs().length }} titles</span>
  </header>

  <main>
    <p class="loading" *ngIf="loading()">
      <span class="pulse">Fetching titles…</span>
    </p>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <ol class="list" *ngIf="!loading() && !error()">
      <li
        class="item"
        *ngFor="let epub of epubs(); let i = index"
        [style.animation-delay]="i * 40 + 'ms'"
      >
        <span class="index">{{ (i + 1).toString().padStart(2, '0') }}</span>
        <span class="title">{{ stripExtension(epub.original_filename) }}</span>
        <span class="badge badge--{{ epub.status }}">{{ statusLabel(epub.status) }}</span>
      </li>
    </ol>
  </main>
</div>
