<div class="media-rows" *ngIf="!loading()">
  <p *ngIf="error()" class="alert alert--error">{{ error() }}</p>

  <!-- Popular row -->
  <div class="media-row" *ngIf="popularJobs().length > 0">
    <h2 class="media-row__heading">
      <span class="media-row__heading-icon">🔥</span> Most Viewed
    </h2>
    <div class="media-row__track-wrapper">
      <button class="media-row__arrow media-row__arrow--left"
              (click)="scroll(popularTrack, 'left')" aria-label="Scroll left">
        ‹
      </button>
      <ul class="media-row__track" #popularTrack role="list">
        <li *ngFor="let job of popularJobs(); trackBy: trackById"
            class="media-card"
            [class.media-card--complete]="isComplete(job)"
            [class.media-card--muted]="!isComplete(job)">
          <a *ngIf="isComplete(job)"
             [routerLink]="graphUrl(job)"
             class="media-card__link">
            <ng-container *ngTemplateOutlet="cardContent; context: { job: job }"></ng-container>
          </a>
          <div *ngIf="!isComplete(job)" class="media-card__link">
            <ng-container *ngTemplateOutlet="cardContent; context: { job: job }"></ng-container>
          </div>
        </li>
      </ul>
      <button class="media-row__arrow media-row__arrow--right"
              (click)="scroll(popularTrack, 'right')" aria-label="Scroll right">
        ›
      </button>
    </div>
  </div>

  <!-- Recent row -->
  <div class="media-row" *ngIf="recentJobs().length > 0">
    <h2 class="media-row__heading">
      <span class="media-row__heading-icon">🕐</span> Recent Searches
    </h2>
    <div class="media-row__track-wrapper">
      <button class="media-row__arrow media-row__arrow--left"
              (click)="scroll(recentTrack, 'left')" aria-label="Scroll left">
        ‹
      </button>
      <ul class="media-row__track" #recentTrack role="list">
        <li *ngFor="let job of recentJobs(); trackBy: trackById"
            class="media-card"
            [class.media-card--complete]="isComplete(job)"
            [class.media-card--muted]="!isComplete(job)">
          <a *ngIf="isComplete(job)"
             [routerLink]="graphUrl(job)"
             class="media-card__link">
            <ng-container *ngTemplateOutlet="cardContent; context: { job: job }"></ng-container>
          </a>
          <div *ngIf="!isComplete(job)" class="media-card__link">
            <ng-container *ngTemplateOutlet="cardContent; context: { job: job }"></ng-container>
          </div>
        </li>
      </ul>
      <button class="media-row__arrow media-row__arrow--right"
              (click)="scroll(recentTrack, 'right')" aria-label="Scroll right">
        ›
      </button>
    </div>
  </div>
</div>

<!-- Shared card body template -->
<ng-template #cardContent let-job="job">
  <div class="media-card__body">
    <span class="media-card__title">{{ job.title }}</span>
    <span class="media-card__meta">
      {{ job.media_type_display }}
      <span *ngIf="job.release_year"> · {{ job.release_year }}</span>
    </span>
  </div>
  <span [class]="'badge badge--' + job.status + ' media-card__badge'">
    {{ job.status_display }}
  </span>
</ng-template>
